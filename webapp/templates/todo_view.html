{% extends 'base.html' %}

{% block title %}Todo{% endblock %}

{% block content %}



    <h1>Todo</h1>



    <div class="card">
        <div class="card-body">
            <p class="card-text fg-1">task: {{ todo.task }}</p>
            <div>
                <a role="button"
                   href="{% url 'todo_delete' todo.pk %}"
                   class="btn-solid theme-danger">Удалить</a>
            </div>
        </div>
    </div>
{% endblock %}
