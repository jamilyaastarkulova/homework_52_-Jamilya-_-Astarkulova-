{% extends 'base.html' %}

{% block title %}Todo delete{% endblock %}

{% block content %}



    <h1>Удаление задания</h1>

    <div class="card">
        <div class="card-body">
            <p>Вы действительно хотите удалить задание "{{ todo.title }}"?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit">Да</button>
            </form>
            <a href="{% url 'todo_view' todo.pk %}">Нет</a>
        </div>
    </div>
{% endblock %}
